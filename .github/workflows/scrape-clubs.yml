name: Scrape Italian clubs

on:
  workflow_dispatch:
    inputs:
      season:
        description: Starting year of the season
        required: true
        default: '2026'
      import_to_d1:
        description: Import generated catalog into the app database
        required: true
        type: boolean
        default: false
      base_url:
        description: App base URL used for D1 import, e.g. https://example.pages.dev
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scrape-italian-clubs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape Serie A, Serie B and Serie C catalog
        run: node scripts/scrape-diretta-clubs.mjs --season=${{ inputs.season }}

      - name: Resolve official logos and derive UI palettes
        run: node scripts/enrich-club-logos.mjs --season=${{ inputs.season }}

      - name: Attach complete Serie C calendars
        run: node scripts/repair-seriec-official.mjs --season=${{ inputs.season }} --calendar-only

      - name: Validate D1 import
        if: ${{ inputs.import_to_d1 }}
        env:
          ADMIN_IMPORT_TOKEN: ${{ secrets.ADMIN_IMPORT_TOKEN }}
          APP_BASE_URL: ${{ inputs.base_url }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "base_url is required when import_to_d1 is enabled"
            exit 1
          fi
          if [ -z "$ADMIN_IMPORT_TOKEN" ]; then
            echo "GitHub secret ADMIN_IMPORT_TOKEN is required when import_to_d1 is enabled"
            exit 1
          fi
          node scripts/import-clubs.mjs "scripts/import-serie-abc-${{ inputs.season }}.json" \
            --base-url="$APP_BASE_URL" --dry-run

      - name: Import catalog and palettes into D1
        if: ${{ inputs.import_to_d1 }}
        env:
          ADMIN_IMPORT_TOKEN: ${{ secrets.ADMIN_IMPORT_TOKEN }}
          APP_BASE_URL: ${{ inputs.base_url }}
        run: |
          node scripts/import-clubs.mjs "scripts/import-serie-abc-${{ inputs.season }}.json" \
            --base-url="$APP_BASE_URL" --apply

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: italian-clubs-${{ inputs.season }}
          path: |
            scripts/import-serie-abc-${{ inputs.season }}.json
            assets/club-logos/

      - name: Commit generated catalog and logos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "scripts/import-serie-abc-${{ inputs.season }}.json" assets/club-logos/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Update Italian club catalog ${{ inputs.season }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
