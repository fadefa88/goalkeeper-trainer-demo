name: Scrape Italian clubs

on:
  workflow_dispatch:
    inputs:
      season:
        description: Starting year of the season
        required: true
        default: '2026'

permissions:
  contents: write

concurrency:
  group: scrape-italian-clubs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        run: node scripts/scrape-diretta-clubs.mjs --season=${{ inputs.season }}

      - name: Resolve team logos and colors
        run: node scripts/enrich-club-logos.mjs --season=${{ inputs.season }}

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: italian-clubs-${{ inputs.season }}
          path: |
            scripts/import-serie-abc-${{ inputs.season }}.json
            assets/club-logos/

      - name: Commit generated catalog and logos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "scripts/import-serie-abc-${{ inputs.season }}.json" assets/club-logos/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Update Italian club catalog ${{ inputs.season }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
